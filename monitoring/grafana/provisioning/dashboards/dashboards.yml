# Auto-loads every dashboard JSON in monitoring/grafana/dashboards/ on
# Grafana startup — no manual "import dashboard" step for a new environment.
apiVersion: 1

providers:
  - name: "ClimateShield Nexus"
    orgId: 1
    folder: "ClimateShield Nexus"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
