# The Alerting Service is the platform's highest-criticality path
# (NFR-AVAIL-003: 99.95% uptime target, docs/05_Non_Functional_Requirements.md)
# so, unlike the other representative service manifests in this directory,
# it additionally gets its own PodDisruptionBudget and HPA — never let a
# voluntary disruption (node drain, rolling upgrade) take every replica down
# at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerting-service
  namespace: csn-services
  labels:
    app.kubernetes.io/name: alerting-service
    app.kubernetes.io/part-of: climateshield-nexus
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: alerting-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alerting-service
        app.kubernetes.io/part-of: climateshield-nexus
    spec:
      serviceAccountName: alerting-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alerting-service
          image: ghcr.io/climateshield-nexus/alerting-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 4003 }]
          envFrom:
            - configMapRef: { name: services-common-config }
            - secretRef: { name: alerting-service-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule # alerting replicas MUST spread across zones
          labelSelector:
            matchLabels: { app.kubernetes.io/name: alerting-service }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alerting-service
  namespace: csn-services
---
apiVersion: v1
kind: Service
metadata:
  name: alerting-service
  namespace: csn-services
  labels: { app.kubernetes.io/name: alerting-service }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: alerting-service }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alerting-service
  namespace: csn-services
spec:
  minAvailable: 2 # never fewer than 2 of 3 replicas during a voluntary disruption
  selector:
    matchLabels: { app.kubernetes.io/name: alerting-service }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alerting-service
  namespace: csn-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alerting-service
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Percent, value: 100, periodSeconds: 30 }]
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
