# Representative Deployment+Service for a Node backend microservice.
# Every service in docs/06_System_Architecture.md#service-catalog
# (auth-service, alerting-service, reporting-service, admin-audit-service)
# follows this exact pattern — copy this file, rename, and point `image`/
# `envFrom` at the new service when it is implemented (docs/40_Developer_Assignment.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: climate-data-service
  namespace: csn-services
  labels:
    app.kubernetes.io/name: climate-data-service
    app.kubernetes.io/part-of: climateshield-nexus
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: climate-data-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: climate-data-service
        app.kubernetes.io/part-of: climateshield-nexus
    spec:
      serviceAccountName: climate-data-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: climate-data-service
          image: ghcr.io/climateshield-nexus/climate-data-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 4002 }]
          envFrom:
            - configMapRef: { name: services-common-config }
            - secretRef: { name: climate-data-service-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: climate-data-service
  namespace: csn-services
---
apiVersion: v1
kind: Service
metadata:
  name: climate-data-service
  namespace: csn-services
  labels: { app.kubernetes.io/name: climate-data-service }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: climate-data-service }
  ports: [{ name: http, port: 80, targetPort: http }]
