# API Gateway deployment — the only workload in csn-gateway that accepts
# ingress traffic (docs/architecture/system-architecture-views.md#network-architecture).
# Image tag is patched per environment/release by the CD pipeline
# (.github/workflows/deploy-staging.yml / deploy-production.yml), never
# hand-edited here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: csn-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: climateshield-nexus
spec:
  replicas: 2 # overlay-patched (dev=1, staging=2, production=3+; see kubernetes/overlays/)
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below full capacity during a deploy — alert path availability (NFR-AVAIL-006)
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: climateshield-nexus
    spec:
      serviceAccountName: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: ghcr.io/climateshield-nexus/gateway:latest # overlay/CD-patched tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef: { name: gateway-config }
            - secretRef: { name: gateway-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # Every service exposes GET /health per docs/design/03_Module_Specifications.md
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: csn-gateway
