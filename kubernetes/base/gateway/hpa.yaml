# HorizontalPodAutoscaler for the gateway — scales on CPU and memory so the
# edge tier keeps up under load spikes (e.g., a severe-weather event driving
# public dashboard traffic), per NFR-SCALE-* in docs/05_Non_Functional_Requirements.md.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: csn-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2 # overlay-patched
  maxReplicas: 10 # overlay-patched
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # avoid flapping down during transient dips
    scaleUp:
      stabilizationWindowSeconds: 0 # scale up immediately — public-safety traffic spikes must not queue
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
