name: Bug Report
description: Report a defect in ClimateShield Nexus
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Structured version of docs/templates/bug_report_template.md — fields map 1:1 so issues and the Markdown template stay interchangeable.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: See docs/14_Testing_Strategy.md#defect-management
      options:
        - "Critical (alert dispatch broken, data corruption, security breach)"
        - "High (core module unusable for a role, incorrect risk severity output)"
        - "Medium (degraded UX, non-blocking)"
        - "Low (cosmetic)"
    validations: { required: true }
  - type: input
    id: module
    attributes:
      label: Module
      description: e.g. Risk Assessment, Alerting, GIS Dashboard — see docs/39_Module_Breakdown.md
    validations: { required: true }
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Local / Staging / Production"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs with request_id — never include real user PII/credentials.
