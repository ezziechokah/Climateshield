# Automated dependency update PRs — implements the "Dependency Updates" CI
# requirement (Part 8) and feeds docs/36_System_Maintenance.md#patching-policy.
# Dependabot opens a PR per outdated dependency group; it still goes through
# the same CI quality gates (lint.yml, security-scan.yml) as any other PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    labels: ["dependencies", "npm"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]

  - package-ecosystem: "docker"
    directory: "/docker/templates"
    schedule: { interval: "weekly", day: "monday" }
    labels: ["dependencies", "docker"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule: { interval: "weekly", day: "monday" }
    labels: ["dependencies", "terraform"]
