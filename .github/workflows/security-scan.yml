name: Security Scan

# SAST, dependency (SCA), secret, and container scanning — implements the
# automated portion of docs/13_Security_Design.md and the CI quality gate in
# docs/14_Testing_Strategy.md#ci-quality-gates. Findings above High severity
# fail the build; see security/README.md for the policy this enforces.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "0 4 * * *" # nightly re-scan catches newly-disclosed CVEs in unchanged code

permissions:
  contents: read
  security-events: write # required for uploading SARIF to the Security tab

jobs:
  sast-codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    strategy:
      matrix: { language: [javascript-typescript, python] }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  sast-semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config=auto --error

  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan-node:
    name: npm audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npm audit --audit-level=high

  dependency-scan-python:
    name: pip-audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-dev.txt

  container-scan:
    name: Trivy container scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [frontend, gateway, climate-data-service, risk-assessment-service, ai-engine, gis-services]
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning (best-effort; skipped until service source exists)
        run: |
          echo "Placeholder — builds docker/${{ matrix.image }} once source exists per docs/40_Developer_Assignment.md"
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "0" # set to "1" once real images exist to build/scan
