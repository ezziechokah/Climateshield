# cert-manager ClusterIssuer — automates TLS certificate issuance/renewal
# for kubernetes/base/ingress.yaml, per docs/13_Security_Design.md and
# docs/architecture/system-architecture-views.md#security-architecture.
# Requires cert-manager to already be installed in the cluster
# (helm install cert-manager jetstack/cert-manager --set installCRDs=true).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-team@climateshield-nexus.example
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  # Staging ACME server has much higher rate limits — use this issuer while
  # testing Ingress/DNS changes to avoid hitting Let's Encrypt's production
  # rate limit (docs/15_Deployment_Guide.md#environments).
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform-team@climateshield-nexus.example
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
# Internal mTLS certificates (service-to-service, docs/13_Security_Design.md#network-security)
# use a self-signed internal CA rather than a public ACME issuer.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca-issuer
spec:
  ca:
    secretName: climateshield-nexus-internal-ca
