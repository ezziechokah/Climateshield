# Shared HTTP security headers snippet — included by every nginx config in
# this repository (docker/frontend/nginx.conf, docker/nginx/nginx.conf) and
# mirrored in the Gateway's own middleware (helmet.js equivalent config) so
# the same policy applies whether a response is served by nginx or the
# Node gateway directly. Implements the "Security Headers" requirement from
# docs/13_Security_Design.md and OWASP ASVS Level 2 (NFR-SEC-003).
#
# Usage in an nginx server block: include security/security-headers.conf;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header X-XSS-Protection "0" always; # deliberately disabled — modern CSP supersedes this legacy, sometimes-harmful header

# Content-Security-Policy: intentionally strict. Loosen only for the
# specific directive a real requirement needs (e.g., Mapbox GL tile
# sources), never with a blanket 'unsafe-inline'/'unsafe-eval'.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org https://api.mapbox.com; connect-src 'self' https://api.climateshield-nexus.example wss://api.climateshield-nexus.example; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Never cache authenticated API responses at a shared/proxy cache layer.
add_header Cache-Control "no-store" always;
