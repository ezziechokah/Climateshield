# Nginx config serving the compiled React SPA (docker/frontend/Dockerfile).
# Listens on 8080 (unprivileged) so the container never needs root.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — baseline defense-in-depth per
    # security/security-headers.conf (full policy lives there; this is the
    # subset specific to serving a static SPA).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets are immutable — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Liveness/readiness target for Docker HEALTHCHECK and Kubernetes probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
