# Edge reverse-proxy config for local docker-compose.prod.yml smoke testing.
# Routes API traffic to the gateway service and everything else to the
# frontend static container, approximating the Load Balancer -> API Gateway
# split-tier in docs/06_System_Architecture.md#deployment-topology.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;

    upstream gateway_upstream {
        server gateway:4000;
    }

    upstream frontend_upstream {
        server frontend:8080;
    }

    # Basic rate limiting mirroring docs/12_API_Specification.md#rate-limiting
    # (production rate limiting is enforced at the gateway itself; this is a
    # coarse edge-level backstop).
    limit_req_zone $binary_remote_addr zone=edge_limit:10m rate=30r/s;

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /api/ {
            limit_req zone=edge_limit burst=60 nodelay;
            proxy_pass http://gateway_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream/;
            proxy_set_header Host $host;
        }
    }
}
